services:
  postgres:
    image: postgres:18-alpine
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iseeu}
      POSTGRES_USER: ${POSTGRES_USER:-iseeu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iseeu}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
