services:
  postgres:
    image: postgres:18-alpine
    # Development defaults for a host with at least 16 GB RAM; lower these on smaller machines.
    command:
      [
        'postgres',
        '-c',
        'shared_buffers=2GB',
        '-c',
        'work_mem=32MB',
        '-c',
        'maintenance_work_mem=1GB',
        '-c',
        'max_wal_size=8GB',
      ]
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iseeu}
      POSTGRES_USER: ${POSTGRES_USER:-iseeu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iseeu}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
